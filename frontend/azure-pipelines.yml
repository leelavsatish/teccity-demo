trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/*

pool:
  name: my-vm-pool
  demands:
    - agent.name -equals myvm-agent

variables:
  imageName: 'myapp'
  acrName: 'teccitydemo.azurecr.io'
  tag: $(Build.BuildId)

stages:
- stage: Build
  jobs:
  - job: BuildAndPush
    steps:
    - task: Docker@2
      displayName: Build and push image
      inputs:
        command: buildAndPush
        repository: $(imageName)              # ✅ only repo name
        dockerfile: Dockerfile
        buildContext: .
        tags: |
          $(tag)
          latest                              # ✅ push both tags
        containerRegistry: 'ACR-Registry-Connection'

- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployToWebApp
    steps:
    - task: AzureWebAppContainer@1
      displayName: Deploy to Web App
      inputs:
        azureSubscription: 'Azure-ARM-Connection'
        appName: 'teccitydemo'
        imageName: '$(acrName)/$(imageName):$(tag)'   # ✅ correct full image reference

