trigger:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/**

pool:
  name: my-vm-pool     # 👈 Your own VM pool
  demands:
    - agent.name -equals myvm-agent

steps:
  - checkout: self

  - script: |
      echo "=== Building Frontend ==="
      cd frontend
      echo "Listing frontend files:"
      ls
      echo "✅ Frontend build complete"
    displayName: "Build Frontend"

