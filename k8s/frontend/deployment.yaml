apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: teccitydemo.azurecr.io/myapp:__TAG__   # pipeline replaces __TAG__
        ports:
        - containerPort: 80

