apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: teccitydemo.azurecr.io/myapp:__TAG__   # pipeline replaces __TAG__
        ports:
        - containerPort: 5000

