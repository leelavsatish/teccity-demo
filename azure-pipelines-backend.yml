trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**

pool:
  name: my-vm-pool
  demands:
    - agent.name -equals myvm-agent

variables:
  imageName: teccity-backend

steps:
  - checkout: self

  # Build Docker image
  - script: |
      echo "=== Building Docker image ==="
      docker build -t $(imageName):latest -f backend/Dockerfile .
    displayName: "Build Flask Docker Image"


  # Deploy via SSH to VM
  - task: SSH@0
    inputs:
      sshEndpoint: 'ssh'
      runOptions: 'commands'
      commands: |
        echo "=== Deploying Flask Docker container ==="
        docker ps -q --filter "name=flask-backend" | grep -q . && docker stop flask-backend && docker rm flask-backend || echo "No existing container"
        docker image rm teccity-backend:latest || true
        cd /home/leela-vm/teccity-demo
        git pull origin main
        docker build -t teccity-backend:latest -f backend/Dockerfile .
        docker run -d -p 5000:5000 --name flask-backend teccity-backend:latest
        echo "✅ Flask backend container deployed successfully"
    displayName: "Deploy Flask Docker Container"
