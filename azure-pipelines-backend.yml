trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - script: |
      echo "=== Building Flask Backend ==="
      cd backend
      python3 -m venv venv
      source venv/bin/activate
      pip install -r requirements.txt
      echo "✅ Backend build successful"
    displayName: "Build Flask Backend"

