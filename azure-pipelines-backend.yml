trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**

pool:
  name: my-vm-pool
  demands:
    - agent.name -equals myvm-agent

variables:
  imageName: 'backend-app'
  acrName: 'teccitydemo.azurecr.io'
  tag: $(Build.BuildId)

stages:
- stage: Build
  jobs:
  - job: BuildAndPush
    steps:
    - task: Docker@2
      displayName: Build backend image
      inputs:
        command: build
        repository: $(acrName)/$(imageName)
        dockerfile: Dockerfile
        buildContext: .
        arguments: --target backend
        tags: |
          $(tag)
        containerRegistry: 'ACR-Registry-Connection'   # <-- Service connection

    - task: Docker@2
      displayName: Push backend image
      inputs:
        command: push
        repository: $(acrName)/$(imageName)
        tags: |
          $(tag)
        containerRegistry: 'ACR-Registry-Connection'

- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployBackend
    steps:
    - task: FileTransform@2
      displayName: Replace tag in backend manifest
      inputs:
        folderPath: k8s/backend
        fileType: yaml
        targetFiles: deployment.yaml
        substitutions: |
          __TAG__=$(tag)

    - task: Kubernetes@1
      displayName: Deploy backend to AKS
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'Azure-ARM-Connection'   # <-- ARM service connection
        azureResourceGroup: '<aks-resource-group>'
        kubernetesCluster: '<aks-cluster-name>'
        namespace: 'myapp'
        command: apply
        useConfigurationFile: true
        configuration: k8s/backend/deployment.yaml
        secretType: 'dockerRegistry'
        containerRegistryType: 'Azure Container Registry'
        azureSubscriptionEndpointForSecrets: 'Azure-ARM-Connection'
        azureContainerRegistry: 'teccitydemo.azurecr.io'
