<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
    <style>
      body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
      form { display: grid; gap: 12px; }
      input[type="text"], input[type="password"] { padding: 8px; }
      button { padding: 10px 14px; cursor: pointer; }
      .flash { background: #fff3cd; padding: 8px 10px; border: 1px solid #ffeeba; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <h1>Login</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="flash">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <label>
        Username
        <input type="text" name="username" required />
      </label>
      <label>
        Password
        <input type="password" name="password" required />
      </label>
      <button type="submit">Log In</button>
    </form>

    <p>Try: <code>user1/pass1</code> or <code>user2/pass2</code></p>
  </body>
</html>
